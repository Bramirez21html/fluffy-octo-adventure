<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Ejemplo</title>
</head>
<body>

    <!-- a. Etiquetas semánticas utilizadas: <header>, <main>, <footer>, <section>, <h1> -->
    <header>
        <h1>Mi Galería y Recursos Web</h1>
    </header>

    <main>
        <section>
            <h2>Tecnologías Destacadas</h2>
            
            <!-- b. Lista con al menos tres elementos -->
            <ul>
                <li>HTML5 Semántico</li>
                <li>Hojas de estilo CSS3</li>
                <li>Interactividad con JavaScript</li>
            </ul>
        </section>

        <section>
            <h2>Galería Visual</h2>
            
            <!-- c. Al menos tres imágenes con texto alternativo -->
            <img src="https://picsum.photos/id/1015/300/200" alt="Vista panorámica de un valle entre montañas verdes">
            <img src="https://picsum.photos/id/1018/300/200" alt="Paisaje natural con un río fluyendo al atardecer">
            <img src="https://picsum.photos/id/1025/300/200" alt="Perro cubierto con una manta en un espacio interior">
        </section>

        <section>
            <h2>Más Información</h2>
            
            <!-- d. Enlace a una fuente externa -->
            <p>
                Aprende más sobre desarrollo web en 
                <a href="https://developer.mozilla.org/es/" target="_blank" rel="noopener noreferrer">MDN Web Docs</a>.
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Todos los derechos reservados.</p>
    </footer>

</body>
</html>
